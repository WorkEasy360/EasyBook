services:
  postgres:
    # The official postgres:16 image (same Debian trixie base, same PostgreSQL
    # build) plus the pgvector extension Phase 10 Ask Books needs — see
    # infrastructure/CLAUDE.md. Same major version and libc as the previous
    # postgres:16 image, so an existing data volume is reused as-is.
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_DB: easybook
      POSTGRES_USER: easybook
      POSTGRES_PASSWORD: easybook
    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easybook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
