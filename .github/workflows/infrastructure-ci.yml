name: Infrastructure CI

# Static checks only: `terraform fmt -check` and `terraform validate`, both of
# which run without AWS credentials (infrastructure/terraform/README.md).
# plan/apply need real credentials and explicit human approval and are never
# run from here.
#
# Exists because the Terraform stack once lived only on a developer's disk —
# nothing in CI would have noticed it failing to validate.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: infrastructure/terraform

jobs:
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      # Pinned to commit SHAs, not tags — see backend-ci.yml.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      # -backend=false: validation must never touch (or need credentials for)
      # the remote state backend.
      - name: Init (providers only)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
