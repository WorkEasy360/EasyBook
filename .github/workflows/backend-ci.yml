name: Backend CI

# The gate described in the build spec, as far as it can run without cloud
# credentials: lint -> security -> dependency audit -> migration drift ->
# the full test suite (unit, integration, API, RLS, concurrency, E2E) ->
# container build -> container vulnerability scan -> (main only) publish the
# exact-SHA image to ECR through GitHub OIDC. Deployment is NOT automatic: it
# stays a manual, approved step (infrastructure/runbooks/deploy.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to the same branch cancels the first — a financial test suite
# is slow enough that queued duplicate runs are pure waste.
concurrency:
  group: backend-ci-${{ github.ref }}
  # Never cancel a run on main: it may be publishing release images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  # Fast feedback: fails in seconds, so a formatting slip never waits behind
  # a three-minute database suite.
  static:
    name: Lint, security, dependency audit
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to immutable commit SHAs, not tags: a tag can be
      # repointed by whoever owns the action, which is a supply-chain hole in
      # a pipeline that handles a financial codebase.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Bandit
        run: bandit -c pyproject.toml -r . -q

      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

  test:
    name: Tests (Postgres 16 + Redis)
    runs-on: ubuntu-latest

    services:
      # A real Postgres, never SQLite: the RLS tests execute actual policies,
      # and the concurrency tests need real row locks. See backend/CLAUDE.md.
      # pgvector image = postgres:16 + the pgvector extension (Phase 10 AI/RAG).
      postgres:
        image: pgvector/pgvector:pg16-trixie
        env:
          POSTGRES_DB: easybook
          POSTGRES_USER: easybook
          POSTGRES_PASSWORD: easybook
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Django connects as easybook_app, NOT the POSTGRES_USER superuser.
      # A superuser bypasses RLS unconditionally, so running CI as one would
      # make every tenant-isolation test pass for the wrong reason — the exact
      # failure mode those tests exist to catch.
      DB_NAME: easybook
      DB_USER: easybook_app
      DB_PASSWORD: easybook_app
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-real-secret
      # Lets backend/ops/tests/test_db_bootstrap.py run the first-environment
      # bootstrap against this real server (scratch database + role, dropped
      # afterwards). The service container's own throwaway credentials.
      DB_BOOTSTRAP_TEST_ADMIN_DSN: host=localhost port=5432 dbname=easybook user=easybook password=easybook
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create the non-superuser application role
        # Mirrors infrastructure/postgres-init/01-app-role.sql, which the
        # local docker-compose Postgres runs automatically but a CI service
        # container does not. CREATEDB is required for the test database.
        env:
          PGPASSWORD: easybook
        run: |
          psql -h localhost -U easybook -d easybook -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
             IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'easybook_app') THEN
                CREATE ROLE easybook_app WITH LOGIN PASSWORD 'easybook_app' CREATEDB;
             END IF;
          END
          $$;
          GRANT ALL PRIVILEGES ON DATABASE easybook TO easybook_app;
          GRANT CREATE, USAGE ON SCHEMA public TO easybook_app;
          SQL

      - name: Install pgvector (superuser-only, untrusted extension)
        # Mirrors infrastructure/postgres-init/02-pgvector.sql. Installing into
        # template1 is what gives Django's test_easybook database the
        # extension, since easybook_app cannot CREATE EXTENSION vector itself.
        env:
          PGPASSWORD: easybook
        run: |
          psql -h localhost -U easybook -d easybook -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U easybook -d template1 -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Assert the CI database role is not a superuser
        # Guards the guard: if this role ever gains superuser, every RLS test
        # silently stops testing anything.
        env:
          PGPASSWORD: easybook_app
        run: |
          IS_SUPER=$(psql -h localhost -U easybook_app -d easybook -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'easybook_app'")
          echo "easybook_app rolsuper=$IS_SUPER"
          test "$IS_SUPER" = "f"

      - name: Migration drift
        # A model change without a migration passes every other check here and
        # then fails on deploy.
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.dev

      - name: Django system checks
        run: python manage.py check --settings=config.settings.test

      - name: Test suite
        run: python manage.py test --settings=config.settings.test --verbosity=2

  # Every PR: build and scan. Publishing happens only in `publish`, on main.
  # Runs after `test` passes: a broken app has no business being scanned.
  container:
    name: Build image, scan for vulnerabilities
    needs: [static, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Build image
        run: docker build -t easybook-backend:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        # Pinned past the March 2026 trivy-action supply-chain compromise
        # (imposter commits injected a credential stealer into every tag
        # 0.0.1-0.34.2 for a ~12h window; verified against
        # aquasecurity/trivy-action's own GitHub releases, checked 2026-09-16)
        # — v0.36.0 is a signed release published well after the incident,
        # pinned by commit rather than tag for the same reason every other
        # action in this workflow is.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: easybook-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: backend/.trivyignore

      - name: Container smoke (non-root, bootstrap entry point present)
        run: |
          test "$(docker run --rm --entrypoint id easybook-backend:${{ github.sha }} -u)" = "10001"
          # The bootstrap task's entry point exists and refuses to run unconfigured.
          if docker run --rm easybook-backend:${{ github.sha }} python -m ops.db_bootstrap; then
            echo "db_bootstrap ran without configuration"; exit 1
          fi

  # Main only, after every gate above has passed. Builds the image again from
  # the same commit, scans it with the same policy, and pushes it tagged with
  # the exact commit SHA — never :latest (ECR tags are IMMUTABLE). Keyless:
  # GitHub OIDC -> the release role (infrastructure/terraform/github_oidc.tf),
  # which trusts only main of this repository and can only push to the two
  # EasyBook repositories. Skipped until the repository variables exist.
  # Nothing is deployed from here: deployment stays a manual, approved step.
  publish:
    name: Publish backend image (main only)
    needs: [static, test, container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_RELEASE_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Build image
        run: docker build -t easybook-backend:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: easybook-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: backend/.trivyignore

      - name: Authenticate to AWS (OIDC, no static keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: easybook-release-${{ github.run_id }}

      - name: Push the commit-SHA tag
        env:
          REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
          SHA: ${{ github.sha }}
        run: |
          REGISTRY="${REPOSITORY%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker tag "easybook-backend:$SHA" "$REPOSITORY:$SHA"
          docker push "$REPOSITORY:$SHA"
          # Proves the exact-SHA image exists for the release step that follows.
          aws ecr describe-images --repository-name "${REPOSITORY#*/}" --image-ids imageTag="$SHA" \
            --query 'imageDetails[0].imageDigest' --output text
